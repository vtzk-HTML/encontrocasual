<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Respostas — Encontro no Refeitório</title>
<link href="https://fonts.googleapis.com/css2?family=Gravitas+One&family=Faustina:ital,wght@0,400;0,600;0,700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    font-family: 'Faustina', Georgia, serif;
    padding: 24px 16px;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
  }
  h1 {
    font-family: 'Gravitas One', 'Faustina', Georgia, serif;
    color: #d9480f;
    text-align: center;
    font-size: 1.5em;
    letter-spacing: 0.8px;
  }
  .login {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .login input {
    flex: 1;
    min-width: 180px;
    padding: 10px 14px;
    border-radius: 30px;
    border: 1px solid #ddd;
    font-family: inherit;
    font-size: 1em;
  }
  .login button {
    padding: 10px 22px;
    border: none;
    border-radius: 30px;
    background: #d9480f;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }
  #lista {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .item {
    background: #fff;
    border-radius: 14px;
    padding: 14px 18px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .item .tag {
    font-weight: bold;
    padding: 5px 14px;
    border-radius: 20px;
    color: #fff;
    font-size: 0.9em;
    white-space: nowrap;
  }
  .tag.sim { background: #40c057; }
  .tag.nao { background: #fa5252; }
  .item .quando {
    color: #777;
    font-size: 0.85em;
  }
  #status {
    text-align: center;
    color: #a94a1c;
    margin-top: 14px;
    font-size: 0.95em;
  }
  #vazio {
    text-align: center;
    color: #a1795f;
    margin-top: 30px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Respostas do convite 🍽️</h1>

  <div class="login">
    <input type="password" id="senha" placeholder="Digite a senha (ADMIN_SECRET)">
    <button onclick="carregar()">Ver respostas</button>
  </div>

  <div id="status"></div>
  <div id="lista"></div>
</div>

<script>
  // Se a senha vier na URL (?secret=...), preenche e já carrega
  const params = new URLSearchParams(window.location.search);
  const secretNaUrl = params.get('secret');
  if (secretNaUrl) {
    document.getElementById('senha').value = secretNaUrl;
    carregar();
  }

  async function carregar() {
    const senha = document.getElementById('senha').value.trim();
    const status = document.getElementById('status');
    const lista = document.getElementById('lista');
    lista.innerHTML = '';
    status.textContent = 'Carregando...';

    if (!senha) {
      status.textContent = 'Digite a senha primeiro.';
      return;
    }

    try {
      const resp = await fetch('/api/respostas?secret=' + encodeURIComponent(senha));
      if (resp.status === 401) {
        status.textContent = '❌ Senha incorreta.';
        return;
      }
      const data = await resp.json();
      status.textContent = '';

      if (!data.respostas || data.respostas.length === 0) {
        lista.innerHTML = '<div id="vazio">Ainda não tem nenhuma resposta 👀</div>';
        return;
      }

      data.respostas.forEach((r) => {
        const div = document.createElement('div');
        div.className = 'item';
        const dataFormatada = new Date(r.data).toLocaleString('pt-BR');
        div.innerHTML = `
          <span class="tag ${r.resposta}">${r.resposta === 'sim' ? 'SIM 🎉' : 'NÃO 🙈'}</span>
          <span class="quando">${dataFormatada}</span>
        `;
        lista.appendChild(div);
      });
    } catch (e) {
      status.textContent = '⚠️ Erro ao carregar as respostas.';
    }
  }
</script>
</body>
</html>
